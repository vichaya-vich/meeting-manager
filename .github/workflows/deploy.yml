name: CD - Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  database-migration:
    name: Database Migration
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v6
        name: Step 1 - Checkout Code
      - uses: actions/setup-node@v7
        name: Step 2 - Use Node.js
        with:
          node-version: '24.x'
      - name: Step 3 - Install Dependencies
        run: npm ci
      - name: Step 4 - Run Prisma Migrate Deploy
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{secrets.DATABASE_URL}}
          
  backend-deploy:
    name: Deploy Backend to Render
    needs: database-migration
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Step 1 - Trigger Render Deploy Hook
        run: |
          RESP=$(curl --fail-with-body --show-error --silent -X POST "$RENDER_DEPLOY_HOOK_URL")
          echo "DEPLOY_ID=$(echo "$RESP" | jq -r '.deploy.id')" >> "$GITHUB_ENV"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{secrets.RENDER_DEPLOY_HOOK_URL}}
      - name: Step 2 - Wait for Render deploy
        run: |
          for i in $(seq 1 60); do
            STATUS=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" | jq -r '.status')
            echo "status: $STATUS"
            case "$STATUS" in
              live) exit 0 ;;
              build_failed|update_failed|canceled|deactivated) exit 1 ;;
            esac
            sleep 10
          done
          echo "timeout"; exit 1
        env:
          RENDER_API_KEY: ${{secrets.RENDER_API_KEY}}
          RENDER_SERVICE_ID: ${{secrets.RENDER_SERVICE_ID}}
        
  frontend-deploy:
    name: Deploy Frontend to Vercel
    needs: database-migration
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        name: Step 1 - Checkout Code
      - name: Step 2 - Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Step 3 - Deploy to Vercel
        run: vercel deploy --prod --cwd=./frontend
        env:
          VERCEL_TOKEN: ${{secrets.VERCEL_TOKEN}}
          VERCEL_ORG_ID: ${{secrets.VERCEL_ORG_ID}}
          VERCEL_PROJECT_ID: ${{secrets.VERCEL_PROJECT_ID}}
